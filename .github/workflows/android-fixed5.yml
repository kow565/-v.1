name: Build KLASWatch Stable APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare stable signing key and build files
        run: |
          mkdir -p signing
          base64 -d signing/klaswatch-dev.jks.b64 > signing/klaswatch-dev.jks
          cp build.gradle.agp9-fixed.kts build.gradle.kts
          cp app/build.gradle.agp9-fixed.kts app/build.gradle.kts
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KLASWatch-v0.5-stable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
