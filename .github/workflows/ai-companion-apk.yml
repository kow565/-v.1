name: Build AI Companion APK

on:
  workflow_dispatch:
  push:
    branches: [ ai-companion-v1, main ]
    paths:
      - 'ai-companion/**'
      - '.github/workflows/ai-companion-apk.yml'
  pull_request:
    paths:
      - 'ai-companion/**'
      - '.github/workflows/ai-companion-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Read app version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' ai-companion/version.properties | cut -d= -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: ai-companion
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK by version
        run: |
          mkdir -p ai-companion/dist
          cp ai-companion/app/build/outputs/apk/debug/app-debug.apk "ai-companion/dist/Harin-v${VERSION_NAME}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Harin-v${{ env.VERSION_NAME }}-debug-apk
          path: ai-companion/dist/Harin-v${{ env.VERSION_NAME }}-debug.apk
