name: Build Android APK Fixed 2
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK in AGP 9 compatibility mode
        run: gradle -Pandroid.builtInKotlin=false -Pandroid.newDsl=false :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KLASWatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
