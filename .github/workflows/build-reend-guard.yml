name: Build REEND Guard Z Flip5

on:
  workflow_dispatch:
  push:
    branches: [ reend-zflip5-guard ]
    paths:
      - 'reend-guard-source.b64.part*'
      - '.github/workflows/build-reend-guard.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36'

      - name: Unpack REEND Guard source
        run: |
          rm -rf reend-guard
          mkdir -p reend-guard
          cat reend-guard-source.b64.part* | base64 -d > reend-guard-source.zip
          unzip -q reend-guard-source.zip -d reend-guard

      - name: Apply release safety patches
        working-directory: reend-guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path("app/src/main/java/com/ojun/reendguard/MacroAccessibilityService.java")
          text = service.read_text(encoding="utf-8")
          old = """        AppPrefs.setRunRequested(this, false);
                  removeRecorderOverlay();
          """
          new = """        AppPrefs.setRunRequested(this, false);
                  // Release the app-return guard whenever playback/recording stops, so the
                  // owner can leave Re:END and reach the launcher or settings normally.
                  // Notification shielding remains active until explicitly restored.
                  AppPrefs.setGuardEnabled(this, false);
                  removeRecorderOverlay();
          """
          if old not in text:
              raise SystemExit("Emergency-stop patch target not found")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          blocker = Path("app/src/main/java/com/ojun/reendguard/NotificationBlockerService.java")
          text = blocker.read_text(encoding="utf-8")
          old_posted = """        if (getPackageName().equals(notification.getPackageName())) {
                      return;
                  }
          """
          new_posted = """        if (getPackageName().equals(notification.getPackageName())
                          || isSafetySystemNotification(notification)) {
                      return;
                  }
          """
          if old_posted not in text:
              raise SystemExit("Notification-posted patch target not found")
          text = text.replace(old_posted, new_posted, 1)

          old_active = """                        && !getPackageName().equals(notification.getPackageName())) {
          """
          new_active = """                        && !getPackageName().equals(notification.getPackageName())
                                  && !isSafetySystemNotification(notification)) {
          """
          if old_active not in text:
              raise SystemExit("Active-notification patch target not found")
          text = text.replace(old_active, new_active, 1)

          method = """
              private static boolean isSafetySystemNotification(StatusBarNotification notification) {
                  String packageName = notification.getPackageName();
                  if (packageName == null) {
                      return false;
                  }
                  return packageName.equals("android")
                          || packageName.equals("com.android.systemui")
                          || packageName.equals("com.android.cellbroadcastreceiver")
                          || packageName.equals("com.google.android.cellbroadcastreceiver")
                          || packageName.equals("com.samsung.android.cellbroadcastreceiver")
                          || packageName.equals("com.sec.android.app.safetyassurance")
                          || packageName.equals("com.samsung.android.safetyinformation")
                          || packageName.equals("com.samsung.android.lool")
                          || packageName.equals("com.samsung.android.sm");
              }
          """
          if "private static boolean isSafetySystemNotification" in text:
              raise SystemExit("Safety-system method already exists unexpectedly")
          class_end = text.rfind("}")
          if class_end < 0:
              raise SystemExit("Notification blocker class end not found")
          text = text[:class_end] + method + text[class_end:]
          blocker.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          text = text.replace("versionCode = 1", "versionCode = 3", 1)
          text = text.replace('versionName = "1.0.0"', 'versionName = "1.0.2"', 1)
          gradle.write_text(text, encoding="utf-8")

          readme = Path("setup/README.txt")
          text = readme.read_text(encoding="utf-8")
          old_line = "6. 긴급 중지는 화면 오른쪽 위 ‘중지’ 또는 볼륨 내리기 버튼 두 번입니다."
          new_line = old_line + "\n   중지하면 다른 앱 이탈 복귀도 함께 풀리며, 알림 차단은 계속 유지됩니다."
          if old_line not in text:
              raise SystemExit("README stop patch target not found")
          text = text.replace(old_line, new_line, 1)
          old_notice = """일반 앱 알림은 보이지 않도록 억제하고 알림창에서도 제거합니다.
          다만 배터리 위험, 과열, 긴급재난 등 Android가 보호하는 일부 시스템 경고는
          운영체제가 앱의 삭제를 거부할 수 있습니다.
          """
          new_notice = """일반 앱 알림은 보이지 않도록 억제하고 알림창에서도 제거합니다.
          단, 배터리 위험·과열·긴급재난 같은 안전 시스템 경고는 의도적으로 남깁니다.
          """
          if old_notice not in text:
              raise SystemExit("README safety notice target not found")
          readme.write_text(text.replace(old_notice, new_notice, 1), encoding="utf-8")
          PY

      - name: Prepare stable signing key
        run: |
          mkdir -p reend-guard/signing
          base64 -d signing/klaswatch-dev.jks.b64 > reend-guard/signing/klaswatch-dev.jks

      - name: Build signed release APK
        working-directory: reend-guard
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          gradle :app:assembleRelease --stacktrace

      - name: Build self-contained Windows setup bundle
        run: |
          set -euxo pipefail
          rm -rf dist stage
          mkdir -p dist stage/REEND-Guard-ZFlip5
          cp reend-guard/app/build/outputs/apk/release/app-release.apk \
            dist/ReEND-Guard-ZFlip5.apk
          cp dist/ReEND-Guard-ZFlip5.apk \
            stage/REEND-Guard-ZFlip5/ReEND-Guard-ZFlip5.apk
          cp reend-guard/setup/setup-zflip5.bat stage/REEND-Guard-ZFlip5/
          cp reend-guard/setup/restore-zflip5.bat stage/REEND-Guard-ZFlip5/
          cp reend-guard/setup/README.txt stage/REEND-Guard-ZFlip5/
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/platform-tools-latest-windows.zip \
            --output /tmp/platform-tools.zip
          unzip -q /tmp/platform-tools.zip -d stage/REEND-Guard-ZFlip5
          (cd stage && zip -q -r ../dist/REEND-Guard-ZFlip5-Setup.zip REEND-Guard-ZFlip5)
          sha256sum dist/ReEND-Guard-ZFlip5.apk \
            dist/REEND-Guard-ZFlip5-Setup.zip > dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: REEND-Guard-ZFlip5
          path: dist/*
          if-no-files-found: error

      - name: Publish latest files to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build REEND Guard Z Flip5 artifacts [skip ci]'
          git push origin HEAD:reend-zflip5-guard
